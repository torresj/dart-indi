name: indi
description: >-
  A pure Dart client for the INDI astronomy protocol. Control telescopes,
  cameras, focusers and more from Flutter apps, with automatic reconnect.
version: 0.1.1
repository: https://github.com/torresj/dart-indi
issue_tracker: https://github.com/torresj/dart-indi/issues

topics:
  - astronomy
  - indi
  - telescope
  - astrophotography
  - protocol

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.5.0

dependencies:
  clock: ^1.1.0
  logging: ^1.2.0
  meta: ^1.15.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  benchmark_harness: ^2.2.0
  coverage: ^1.8.0
  fake_async: ^1.3.1
  lints: ">=4.0.0 <7.0.0"
  test: ^1.25.0
  xml: ">=6.5.0 <8.0.0"
